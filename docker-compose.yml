services:
  mysql:
    image: mysql:8.0
    container_name: empassign-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: empassign
      MYSQL_USER: empassign
      MYSQL_PASSWORD: empassign
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
