services:
  mysql:
    image: mysql:8.0
    container_name: empassign-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: empassign
      MYSQL_USER: empassign
      MYSQL_PASSWORD: empassign
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  jenkins:
    image: jenkins/jenkins:2.579
    container_name: empassign-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  mysql_data:
  jenkins_home:
