services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: empassign
      MYSQL_USER: empassign
      MYSQL_PASSWORD: empassign
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uempassign -pempassign"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - jenkins


  tomcat:
    build:
      context: .
      dockerfile: Dockerfile.tomcat

    image: empassign-tomcat:ci
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: empassign
      DB_PASSWORD: empassign

    ports:
      - "8080:8080"

    networks:
      - jenkins


volumes:

  mysql_data:
    external: true
    name: empassign_mysql_data


networks:

  jenkins:
    external: true
    name: jenkins