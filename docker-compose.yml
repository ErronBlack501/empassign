services:
  mysql:
    image: mysql:8.0
    container_name: empassign-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: empassign
      MYSQL_USER: empassign
      MYSQL_PASSWORD: empassign
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  tomcat:
    image: tomcat:jre21-temurin-noble
    container_name: empassign-tomcat
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - ./target/empassign-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/empassign.war:ro

volumes:
  mysql_data:
